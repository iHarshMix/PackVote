name: Deploy to Production

on:
  push:
    branches:
      - feat/step-9-deployment

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/packvote-backend:$IMAGE_TAG -t $ECR_REGISTRY/packvote-backend:latest -f Dockerfile.backend .
          docker push $ECR_REGISTRY/packvote-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/packvote-backend:latest

      - name: Build and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/packvote-frontend:$IMAGE_TAG -t $ECR_REGISTRY/packvote-frontend:latest -f Dockerfile.frontend .
          docker push $ECR_REGISTRY/packvote-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/packvote-frontend:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "~/packvote/"

      - name: SSH and Restart Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Navigate to target folder
            mkdir -p ~/packvote
            cd ~/packvote

            # Log in to AWS ECR using EC2 role credentials
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            # Retrieve secrets from Secrets Manager and write to .env
            aws secretsmanager get-secret-value --secret-id packvote/production --query SecretString --output text | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]' > .env

            # Add Registry and Image Tag environment variables to .env
            echo "ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com" >> .env
            echo "IMAGE_TAG=latest" >> .env

            # Pull latest images and restart
            docker compose pull
            docker compose up -d
