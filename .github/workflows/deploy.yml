name: Deploy to Production

on:
  push:
    branches:
      - feat/step-9-deployment

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/packvote-backend:$IMAGE_TAG -t $ECR_REGISTRY/packvote-backend:latest -f Dockerfile.backend .
          docker push $ECR_REGISTRY/packvote-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/packvote-backend:latest

      - name: Build and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/packvote-frontend:$IMAGE_TAG -t $ECR_REGISTRY/packvote-frontend:latest -f Dockerfile.frontend .
          docker push $ECR_REGISTRY/packvote-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/packvote-frontend:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml, deploy.sh, and .env.example to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "docker-compose.yml,deploy.sh,.env.example"
          target: "/opt/packvote/"

      - name: SSH and Execute Deployment Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            chmod +x /opt/packvote/deploy.sh
            IMAGE_TAG=${{ github.sha }} /opt/packvote/deploy.sh
